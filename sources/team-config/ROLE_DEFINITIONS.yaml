# Happy Role Definitions - Complete Role Registry
# Version: 2.0
# Last Updated: 2025-01-18
#
# This is the unified role registry for the Happy multi-agent system.
# It serves as a comprehensive reference for all 21 available roles.
#
# Source of Truth: ROLE_REGISTRY.cjs dynamically loads these from
# individual SKILL.md files in kanban/sources/team-config/skills/
#
# Role Categories:
#   - Coordination: Planning, orchestrating, managing
#   - Product: Vision, requirements, user research
#   - Design: UX, UI, product design
#   - Architecture: Technical decisions, system design
#   - Development: Implementation, coding
#   - QA: Testing, quality assurance, reviewing
#   - Support: Documentation, observation

# =====================================================================
# COORDINATION ROLES
# =====================================================================

orchestrator:
  category: coordination
  title: Orchestrator
  summary: Plans, delegates, and coordinates team workflows
  model: claude-opus-4-5
  temperature: 0.3
  capabilities:
    - Break down user requests into actionable tasks
    - Assign tasks based on role expertise AND category-based routing
    - Monitor team progress and coordinate handoffs
    - Unblock team members and resolve conflicts
    - Maintain Kanban board accuracy
    - Route tasks automatically using category system
    - Orchestrate spec-driven development workflow
  required_tools:
    - update_task
    - list_tasks
    - send_team_message
    - read
  disallowed_tools:
    - bash
    - edit
    - spawn_session
  access_level: read-only
  legacy_mapping: master

project-manager:
  category: coordination
  title: Project Manager
  summary: Manages project timelines, coordinates resources, tracks risks
  model: claude-opus-4-5
  temperature: 0.3
  capabilities:
    - Manage project timelines and milestones
    - Coordinate resource allocation across team
    - Track project risks and mitigation plans
    - Report project status to stakeholders
    - Facilitate team communication and collaboration
    - Identify and resolve blockers
    - Manage project scope and changes
  required_tools:
    - read
    - update_task
    - list_tasks
    - send_team_message
    - grep
  disallowed_tools:
    - edit
    - bash
    - spawn_session
  access_level: read-only

